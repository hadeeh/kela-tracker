<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kela Khana Tracker 🍌</title>
<style>
  :root {
    --banana: #FFE135;
    --banana-dark: #F5C518;
    --peel: #8B5E3C;
    --leaf: #4CAF50;
    --ink: #2B1B0E;
    --cream: #FFF8E1;
    --danger: #E53935;
    --card: #FFFFFF;
    --shadow: 0 6px 0 rgba(43,27,14,0.12), 0 10px 30px rgba(43,27,14,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #FFF8E1 0%, #FFEEB3 60%, #FFE135 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 8px 0 18px;
  }
  header .emoji {
    font-size: 54px;
    display: inline-block;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-6px) rotate(6deg); }
  }
  header h1 {
    font-size: 28px;
    margin-top: 4px;
    letter-spacing: -0.5px;
  }
  header p {
    color: var(--peel);
    font-size: 14px;
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  /* Settings row */
  .settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--peel);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #EFE0B5;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input:focus {
    border-color: var(--banana-dark);
    background: #fff;
  }
  .field .prefix {
    display: flex;
    align-items: center;
    border: 2px solid #EFE0B5;
    border-radius: 12px;
    background: var(--cream);
    overflow: hidden;
  }
  .field .prefix:focus-within { border-color: var(--banana-dark); background:#fff; }
  .field .prefix span {
    padding: 0 10px;
    font-weight: 700;
    color: var(--peel);
    font-size: 14px;
  }
  .field .prefix input {
    border: none;
    background: transparent;
    border-radius: 0;
  }

  /* Total panel */
  .total-panel {
    background: linear-gradient(135deg, #FFE135 0%, #F5C518 100%);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .total-panel::before {
    content: "🍌";
    position: absolute;
    font-size: 120px;
    opacity: 0.12;
    right: -10px;
    top: -20px;
    transform: rotate(-15deg);
  }
  .total-panel .label {
    font-size: 13px;
    font-weight: 700;
    color: var(--peel);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .total-panel .amount {
    font-size: 44px;
    font-weight: 900;
    color: var(--ink);
    margin: 6px 0 2px;
    letter-spacing: -1px;
  }
  .total-panel .sub {
    font-size: 14px;
    color: var(--peel);
    font-weight: 600;
  }
  .total-panel .sub b { color: var(--ink); }

  /* Big button */
  .kela-btn {
    width: 100%;
    border: none;
    background: var(--ink);
    color: var(--banana);
    font-size: 22px;
    font-weight: 900;
    padding: 22px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 #000, var(--shadow);
    letter-spacing: 0.5px;
    transition: transform .08s, box-shadow .08s;
    margin-bottom: 12px;
  }
  .kela-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #000, 0 4px 12px rgba(43,27,14,0.10);
  }
  .kela-btn .b { font-size: 28px; vertical-align: middle; margin-right: 8px; }

  .reason-input {
    width: 100%;
    padding: 12px 14px;
    border: 2px dashed #E0C97A;
    border-radius: 12px;
    font-size: 15px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    margin-bottom: 12px;
    transition: border-style .15s, border-color .15s;
  }
  .reason-input:focus { border-style: solid; border-color: var(--banana-dark); background:#fff; }
  .reason-input::placeholder { color: #B59A4E; font-style: italic; }

  .helper {
    font-size: 12px;
    color: var(--peel);
    text-align: center;
    margin-bottom: 4px;
  }

  /* History */
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .history-head h2 {
    font-size: 17px;
    letter-spacing: -0.3px;
  }
  .history-head button {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .history-head button:hover { background: #FFEBEE; }

  .log {
    list-style: none;
    max-height: 360px;
    overflow-y: auto;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: #E0C97A; border-radius: 3px; }

  .entry {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #F3E6BF;
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .entry:last-child { border-bottom: none; }
  .entry .b {
    font-size: 26px;
    line-height: 1;
    flex-shrink: 0;
  }
  .entry .body { flex: 1; min-width: 0; }
  .entry .reason {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
  }
  .entry .reason.empty { color: #A8915A; font-style: italic; font-weight: 500; }
  .entry .meta {
    font-size: 12px;
    color: var(--peel);
    margin-top: 3px;
  }
  .entry .fine {
    font-weight: 800;
    color: var(--danger);
    white-space: nowrap;
    align-self: center;
    font-size: 15px;
  }
  .entry .del {
    background: none; border: none; cursor: pointer;
    color: #C9B580; font-size: 18px; padding: 0 2px;
    align-self: center;
  }
  .entry .del:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--peel);
  }
  .empty-state .big { font-size: 42px; }
  .empty-state p { font-size: 14px; margin-top: 6px; font-weight: 600; }

  footer {
    text-align: center;
    color: var(--peel);
    font-size: 12px;
    padding: 12px 0 4px;
    opacity: 0.8;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--banana);
    padding: 14px 22px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform .3s cubic-bezier(.2,.8,.3,1.2);
    z-index: 99;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 420px) {
    .settings { grid-template-columns: 1fr; }
    header h1 { font-size: 24px; }
    .total-panel .amount { font-size: 36px; }
    .kela-btn { font-size: 19px; padding: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <div class="emoji">🍌</div>
      <h1>Kela Khana Tracker</h1>
      <p>Log every offense. Calculate the fine. 😤</p>
    </header>

    <!-- Total fine due -->
    <div class="total-panel">
      <div class="label">Total Fine Due</div>
      <div class="amount" id="totalAmount">PKR 0</div>
      <div class="sub"><b id="totalCount">0</b> kela eaten so far</div>
    </div>

    <!-- Settings -->
    <div class="card">
      <div class="settings">
        <div class="field">
          <label>Offender's Name</label>
          <input type="text" id="nameInput" value="Dost" maxlength="24" />
        </div>
        <div class="field">
          <label>Rate per Kela</label>
          <div class="prefix">
            <span>PKR</span>
            <input type="number" id="rateInput" value="50" min="0" step="5" />
          </div>
        </div>
      </div>
    </div>

    <!-- Log a kela -->
    <div class="card">
      <input type="text" id="reasonInput" class="reason-input" placeholder="What triggered the kela? (optional)" maxlength="120" />
      <button class="kela-btn" id="kelaBtn">
        <span class="b">🍌</span> KELA KHAYA!
      </button>
      <div class="helper">Tap whenever <b id="nameMirror">Dost</b> gets offended 😤</div>
    </div>

    <!-- History -->
    <div class="card">
      <div class="history-head">
        <h2>📜 Kela Log</h2>
        <button id="clearBtn">Clear All</button>
      </div>
      <ul class="log" id="log"></ul>
    </div>

    <footer>Made with 🍌 for easily-offended friends · Data saved locally</footer>
  </div>

  <div class="toast" id="toast">🍌 Kela logged!</div>

<script>
(function () {
  "use strict";

  var KEY = "kela-tracker-v1";
  var state = load();

  var $ = function (id) { return document.getElementById(id); };
  var nameInput = $("nameInput"), rateInput = $("rateInput"),
      reasonInput = $("reasonInput"), logEl = $("log"),
      totalAmount = $("totalAmount"), totalCount = $("totalCount"),
      nameMirror = $("nameMirror"), toast = $("toast"),
      kelaBtn = $("kelaBtn"), clearBtn = $("clearBtn");

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { name: "Dost", rate: 50, entries: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function fmtMoney(n) {
    return "PKR " + Number(n).toLocaleString("en-PK");
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var hh = d.getHours(), m = d.getMinutes(), ap = "AM";
    if (hh >= 12) { ap = "PM"; if (hh > 12) hh -= 12; }
    if (hh === 0) hh = 12;
    var mm = m < 10 ? "0" + m : m;
    return months[d.getMonth()] + " " + d.getDate() + ", " + hh + ":" + mm + " " + ap;
  }

  function render() {
    nameInput.value = state.name;
    rateInput.value = state.rate;
    nameMirror.textContent = state.name || "Dost";

    var total = 0;
    for (var i = 0; i < state.entries.length; i++) total += state.entries[i].rate;

    totalAmount.textContent = fmtMoney(total);
    totalCount.textContent = state.entries.length;

    if (state.entries.length === 0) {
      logEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="big">🎉</div>' +
          '<p>No kela eaten yet. What a peaceful day.</p>' +
        '</div>';
      return;
    }

    var html = "";
    // newest first
    for (var j = state.entries.length - 1; j >= 0; j--) {
      var e = state.entries[j];
      var reasonText = e.reason ? escapeHtml(e.reason) : "No reason given";
      var cls = e.reason ? "reason" : "reason empty";
      html +=
        '<li class="entry">' +
          '<div class="b">🍌</div>' +
          '<div class="body">' +
            '<div class="' + cls + '">' + reasonText + '</div>' +
            '<div class="meta">' + fmtDate(e.ts) + '</div>' +
          '</div>' +
          '<div class="fine">' + fmtMoney(e.rate) + '</div>' +
          '<button class="del" data-idx="' + j + '" title="Remove">✕</button>' +
        '</li>';
    }
    logEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }

  function addKela() {
    var reason = reasonInput.value.trim();
    var rate = parseFloat(rateInput.value) || 0;
    state.rate = rate; // keep in sync
    state.entries.push({ ts: Date.now(), reason: reason, rate: rate });
    save();
    reasonInput.value = "";
    render();
    // celebratory banana
    var messages = [
      "🍌 Kela logged!",
      "🍌 Another one!",
      "😤 Offense recorded!",
      "💸 Cha-ching!",
      "🍌 Nazakat ka record!"
    ];
    showToast(messages[Math.floor(Math.random() * messages.length)]);
  }

  // Events
  kelaBtn.addEventListener("click", addKela);
  reasonInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addKela(); }
  });

  nameInput.addEventListener("input", function () {
    state.name = nameInput.value || "Dost";
    nameMirror.textContent = state.name;
    save();
  });
  rateInput.addEventListener("input", function () {
    state.rate = parseFloat(rateInput.value) || 0;
    save();
  });

  logEl.addEventListener("click", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("del")) {
      var idx = parseInt(t.getAttribute("data-idx"), 10);
      if (!isNaN(idx)) {
        state.entries.splice(idx, 1);
        save();
        render();
        showToast("Removed 🍌");
      }
    }
  });

  clearBtn.addEventListener("click", function () {
    if (state.entries.length === 0) return;
    if (confirm("Clear ALL kela records? This can't be undone.")) {
      state.entries = [];
      save();
      render();
      showToast("All clear 🧹");
    }
  });

  render();
})();
</script>
</body>
</html>
